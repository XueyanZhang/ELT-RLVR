[project]
name = "elt-rlvr"
version = "0.1.0"
description = "A Tinker RLVR environment for ELT-Bench"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "duckdb>=1.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["elt_rlvr*"]
